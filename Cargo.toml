[workspace]
resolver = "2"
members = ["crates/orbit-sim", "crates/orbit-wasm", "crates/orbit-server"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
orbit-sim = { path = "crates/orbit-sim" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Keep float semantics identical between native and wasm builds.
opt-level = 3
lto = true
codegen-units = 1

[profile.release.package.orbit-wasm]
opt-level = "s"
